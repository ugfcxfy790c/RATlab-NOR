name: Build Linux AppImage

# Builds a real AppImage on GitHub-hosted Ubuntu runners, since
# PyInstaller can't cross-compile -- an AppImage built anywhere else (a
# local sandbox, an ARM Mac, etc.) only runs on that same CPU
# architecture, and an AppImage built for one architecture doesn't run
# on the other. This exists specifically for a maintainer without
# access to that hardware directly: push/tag here, download the results
# from the Actions run instead of building locally.
#
# Builds both x86_64 (the common case -- most desktops/laptops) and
# aarch64 (ARM Linux -- Raspberry Pi, Ampere/Graviton-style ARM cloud
# VMs, ARM dev laptops) via a matrix, since unlike Windows-on-ARM or
# Apple Silicon, stock Linux ARM64 has no built-in x86_64 compatibility
# layer -- the x86_64 AppImage simply won't run there at all, not just
# slowly.
#
# Trigger it either by pushing a tag like "v1.2.3" (also uploads both
# AppImages as release assets, if a GitHub Release for that tag exists)
# or manually from the Actions tab ("Run workflow").
#
# Does NOT bundle model weights (../models/, a sibling of this repo's
# root) -- those aren't expected to be committed to the repo (see
# build_linux.sh's own comments on GitHub's 100MB file cap). This
# workflow only produces the app-only AppImages; if you want the
# combined "AppImage + models" release tarball build_linux.sh can also
# build, run that step locally against one of this workflow's AppImages
# plus your own models/ folder.
#
# Paths below are relative to this repo's own root (this repo *is* the
# nor_classifier/ folder -- there's no extra nor_classifier/ path segment
# to go through, unlike a local RATlab checkout where nor_classifier/ is
# a subfolder of the wider RATlab lab folder).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # GitHub's ubuntu-22.04+ runner images dropped libfuse2, which
      # appimagetool (itself an AppImage) needs to run directly -- without
      # this, build_linux.sh's appimagetool invocation fails with a
      # confusing "dlopen(): error loading libfuse.so.2" rather than
      # anything that looks like a missing-dependency message.
      - name: Install libfuse2 (required to run appimagetool)
        run: sudo apt-get update && sudo apt-get install -y libfuse2

      - name: Build the AppImage
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: RATlab_NOR-${{ matrix.arch }}.AppImage
          path: packaging/dist/RATlab_NOR-${{ matrix.arch }}.AppImage
          if-no-files-found: error

      # Only runs on a tag push (not workflow_dispatch), and only if a
      # GitHub Release for that tag already exists -- create the release
      # first (draft is fine), then push the tag, to get both AppImages
      # attached automatically (each matrix job uploads its own).
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: packaging/dist/RATlab_NOR-${{ matrix.arch }}.AppImage
